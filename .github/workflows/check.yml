name: Check

# The health signal is arithmetic against a nine-hour cadence, and every way it
# can break is quiet: the board keeps rendering, keeps looking maintained, and
# starts asserting things the data cannot support. This runs on every push so a
# drifted constant fails here instead of on the board.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # npm install rather than npm ci. The lock is generated on Windows and
      # several dependencies resolve to platform-specific native binaries —
      # lightningcss under Tailwind, and ws's optional accelerators — so a
      # lock that is correct there is missing entries a Linux runner expects,
      # and strict ci rejects it before running a single test. Vercel installs
      # the same way and builds cleanly. The cost is that a transitive version
      # can drift between runs; the alternative was a check that never ran.
      - run: npm install --no-audit --no-fund

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm test
