name: Faucet probe

# Wakes hourly, at seventeen minutes past. The workflow does not decide when a
# faucet may be called — it only asks. The endpoint holds the clock and answers
# "not yet" for anything still inside its window.
#
# The probe itself should land roughly every nine hours; that interval is
# enforced in src/lib/faucets.ts, not here. A cron pinned to nine hours would
# drift, because GitHub's scheduler runs late under load and any attempt to
# compensate eventually fires early — into an upstream cooldown.
#
# This asks for every hour rather than every thirty minutes, and asks off the
# hour, because GitHub drops scheduled runs outright when its queue is busy and
# the top of the hour is the busiest moment there is. That dropping is not
# theoretical: an earlier version of this file asked for every thirty minutes
# and was granted five runs in a day, spaced 2.4, 3.9, 10.4, 10.0 and 8.3 hours
# apart — long enough that the board went twenty hours without an observation
# and correctly reported that it no longer knew anything.
#
# So this schedule is the opportunistic half. The guaranteed half is a daily
# cron in vercel.json, which does not skip. Both call the same endpoint and the
# endpoint refuses whichever one is early, so running both costs nothing.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: faucet-relay
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ask which faucets are due for a probe
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
        run: |
          set -euo pipefail

          # Fail loudly. An earlier version exited 0 here, and the result was
          # eight consecutive green runs that had never called anything: the
          # secret existed but held an empty string, so every wake-up skipped
          # the probe and reported success. A schedule that cannot reach its
          # endpoint is broken, and the run history is the only place that
          # shows it.
          if [ -z "${RELAY_URL:-}" ] || [ -z "${RELAY_TOKEN:-}" ]; then
            echo "RELAY_URL or RELAY_TOKEN is empty. The probe cannot run."
            exit 1
          fi

          code=$(curl -sS -o response.json -w '%{http_code}' \
            --max-time 120 \
            -X POST "$RELAY_URL/api/relay/tick" \
            -H "Authorization: Bearer $RELAY_TOKEN" \
            -H "Content-Type: application/json")

          echo "Endpoint responded $code"
          # Safe to print: the response carries faucet ids, outcomes and
          # timestamps. No key crosses this boundary.
          cat response.json
          echo

          # 200 means work was done or nothing was due. 429 means we asked too
          # early, which is a scheduling bug worth seeing but not a red run.
          if [ "$code" = "200" ] || [ "$code" = "429" ]; then
            exit 0
          fi
          exit 1
