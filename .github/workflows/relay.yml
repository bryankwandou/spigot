name: Faucet probe

# Wakes hourly at seventeen past, and then keeps asking on its own.
#
# The workflow never decides when a faucet may be called. The endpoint holds
# the clock — 8h3m after a grant, an hour after a refusal — and answers "not
# yet" to anything early. Everything here is about being present often enough
# that the clock gets a chance to say yes.
#
# Being present is the hard part, because GitHub drops scheduled runs outright
# when its queue is busy. That is measured, not feared: an earlier version asked
# every thirty minutes and was granted five runs in a day, spaced 2.4, 3.9,
# 10.4, 10.0 and 8.3 hours apart. Asking hourly and off the hour helps, and is
# still not enough — a probe that wants to retry hourly cannot rely on a
# scheduler that skips eight of them in a row.
#
# So a run does not exit after one request. It stays alive and knocks every
# fifty-five minutes for most of a working day. GitHub caps a job at six hours,
# which is the only reason this stops at six rounds. The repository is public,
# so the minutes are free, and a sleeping runner costs nothing but a slot.
#
# `cancel-in-progress: true` is deliberate. When the next scheduled run does
# arrive it should replace the heartbeat rather than queue behind it: one live
# prober at a time, always the freshest. If the schedule is dropped, the run
# already going keeps the hourly cadence by itself.
#
# The guaranteed floor underneath all of this is the daily cron in vercel.json,
# which does not skip. Both call the same endpoint; the early one is refused.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: faucet-relay
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    # Six hours is GitHub's ceiling for a job. Sit just under it.
    timeout-minutes: 350
    steps:
      - name: Knock hourly for as long as this runner is allowed to live
        env:
          RELAY_URL: ${{ secrets.RELAY_URL }}
          RELAY_TOKEN: ${{ secrets.RELAY_TOKEN }}
          ROUNDS: "6"
          GAP_SECONDS: "3300"
        run: |
          set -euo pipefail

          # Fail loudly. An earlier version exited 0 here, and the result was
          # eight consecutive green runs that had never called anything: the
          # secret existed but held an empty string, so every wake-up skipped
          # the probe and reported success. A schedule that cannot reach its
          # endpoint is broken, and the run history is the only place that
          # shows it.
          if [ -z "${RELAY_URL:-}" ] || [ -z "${RELAY_TOKEN:-}" ]; then
            echo "RELAY_URL or RELAY_TOKEN is empty. The probe cannot run."
            exit 1
          fi

          failures=0

          for round in $(seq 1 "$ROUNDS"); do
            echo "--- round $round of $ROUNDS at $(date -u '+%Y-%m-%dT%H:%M:%SZ') ---"

            code=$(curl -sS -o response.json -w '%{http_code}' \
              --max-time 120 \
              -X POST "$RELAY_URL/api/relay/tick" \
              -H "Authorization: Bearer $RELAY_TOKEN" \
              -H "Content-Type: application/json") || code="000"

            echo "Endpoint responded $code"
            # Safe to print: the response carries faucet ids, outcomes and
            # timestamps. No key crosses this boundary.
            cat response.json || true
            echo

            # 200 means work was done or nothing was due. 429 means we asked
            # too early, which is worth seeing but is not a broken deployment.
            case "$code" in
              200|429) ;;
              *) failures=$((failures + 1)) ;;
            esac

            # A bad round is not a reason to stop knocking. The next one is
            # fifty-five minutes away and the faucet may have recovered by then.
            if [ "$round" -lt "$ROUNDS" ]; then
              sleep "$GAP_SECONDS"
            fi
          done

          if [ "$failures" -gt 0 ]; then
            echo "$failures of $ROUNDS rounds could not reach the endpoint."
            exit 1
          fi
